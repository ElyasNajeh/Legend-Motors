services:

  postgres:
    image: postgres:17
    container_name: legend-motors-postgres

    restart: unless-stopped

    env_file:
      - .env

    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER} -d ${DATABASE_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10


  adminer:
    image: adminer:latest
    container_name: legend-motors-adminer

    restart: unless-stopped

    ports:
      - "8080:8080"

    depends_on:
      postgres:
        condition: service_healthy


  api:
    build:
      context: ./LegendMotorsAPI

    container_name: legend-motors-api

    restart: unless-stopped

    env_file:
      - .env

    ports:
      - "8000:8000"

    depends_on:
      postgres:
        condition: service_healthy

    volumes:
      - uploads_data:/app/uploads
      - ./LegendMotorsUI/src/assets/site_assets:/app/seed_assets:ro


  ui:
    build:
      context: ./LegendMotorsUI

    container_name: legend-motors-ui

    restart: unless-stopped

    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
      VITE_WHATSAPP_NUMBER: ${VITE_WHATSAPP_NUMBER:-}

    ports:
      - "5173:5173"

    depends_on:
      - api


volumes:
  postgres_data:
  uploads_data:
